name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      POLICE_VOLEUR_STATS: ${{ runner.temp }}/police-voleur-stats.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Compilation
        run: python -m compileall -q ai core modes multiplayer tests tools config.py main.py match.py net.py stats.py
      - name: Benchmark IA
        run: python tools/benchmark_ai.py --games 3 --depth 3
